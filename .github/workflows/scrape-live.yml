name: Scrape live listings

on:
  workflow_dispatch:
    inputs:
      property_type:
        description: Property category
        required: true
        default: all
        type: choice
        options:
          - apartments
          - houses
          - all
      max_pages:
        description: Maximum search pages per category
        required: true
        default: 1
        type: number
      max_listings_per_category:
        description: Maximum detail pages per category
        required: true
        default: 20
        type: number
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: aruodas-scrape-live
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install -e .
      # --no-config: config/scrape.yaml is the local workstation's run configuration and
      # points cookie_file at a secret kept outside the repository. Auto-discovering it here
      # would abort the run with "Cookie file was not found", so CI passes every bound
      # explicitly instead. The transport still defaults to curl.
      - name: Retrieve bounded snapshot
        run: |
          python -m aruodas_scraper scrape-live \
            --no-config \
            --city vilnius \
            --property-type "${{ inputs.property_type || 'all' }}" \
            --output data/processed \
            --cache "${{ runner.temp }}/aruodas-cache" \
            --max-pages "${{ inputs.max_pages || 2 }}" \
            --max-listings-per-category "${{ inputs.max_listings_per_category || 40 }}"
      - name: Validate apartment export
        if: ${{ hashFiles('data/processed/apartments_vilnius.csv') != '' }}
        run: python -m aruodas_scraper validate data/processed/apartments_vilnius.csv
      - name: Validate house export
        if: ${{ hashFiles('data/processed/houses_vilnius.csv') != '' }}
        run: python -m aruodas_scraper validate data/processed/houses_vilnius.csv
      - name: Upload snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aruodas-vilnius-${{ github.run_id }}
          path: data/processed/**
          if-no-files-found: warn
          retention-days: 30