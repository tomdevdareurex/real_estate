name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Installed only here. Ruff ships as a native executable, which this project's
      # workstation cannot always run, so it is kept out of the `dev` extra and Linux CI
      # is the only place it runs. See CLAUDE.md.
      - run: python -m pip install ruff==0.12.9
      - run: python -m ruff check src tests
      - run: python -m black --check src tests
      - run: python -m isort --check-only src tests
      - run: python -m mypy src
      - run: python -m bandit -r src
      - run: python -m pytest --cov=aruodas_scraper --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
