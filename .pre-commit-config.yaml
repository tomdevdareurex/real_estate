repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: .venv/Scripts/python.exe -m black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: .venv/Scripts/python.exe -m isort
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/Scripts/python.exe -m mypy
        language: system
        pass_filenames: false
        args: [src]
