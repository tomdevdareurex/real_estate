[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aruodas-scraper"
version = "0.1.0"
description = "Parser and exporter for Aruodas real-estate listing HTML."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aruodas Scraper Contributors" }]
dependencies = [
  "brotli==1.1.0",
  "curl_cffi==0.16.0",
  "h2==4.2.0",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "selectolax==0.3.29",
  "tenacity==9.1.2",
  "truststore==0.10.1",
  "typer==0.16.0",
]

[project.optional-dependencies]
# Only `mint-cookie` needs this, and only on a workstation with a person at the keyboard:
# it drives the Chrome already installed there so a human can solve the bot-protection
# challenge. CI never mints, and the scraper imports it lazily, so keeping it out of the
# required set leaves the package installable where no browser exists.
browser = ["playwright==1.62.0"]

# Everything the quality gate needs. This used to live in requirements-dev.txt, alongside a
# requirements.txt that repeated `dependencies` above verbatim - two files that had to be
# kept in step by hand with nothing checking they were. `pip install -e ".[dev]"` now
# installs the runtime pins and the tooling from one place.
#
# ruff is deliberately absent: it is installed by CI only. See CLAUDE.md.
dev = [
  "bandit==1.8.6",
  "black==25.1.0",
  "build==1.2.2.post1",
  "isort==6.0.1",
  "mypy==1.17.1",
  "pre-commit==4.3.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "types-PyYAML==6.0.12.20250516",
]

[project.scripts]
aruodas = "aruodas_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aruodas_scraper"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: isolated unit tests",
  "integration: component integration tests",
]

[tool.coverage.run]
branch = true
source = ["aruodas_scraper"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aruodas_scraper"]
